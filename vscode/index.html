<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لقمة | تعلّم الأكل الشعبي</title>
<style>
:root{--bg:#2A1710;--bg2:#3A2217;--card:#46291B;--or:#E8691A;--cr:#F6ECDC;--mu:#C9B49C;--gold:#F2B66B;--ok:#7FD39A}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 80% -10%,#4d2c1c,var(--bg) 55%);color:var(--cr);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh;line-height:1.7}
header{display:flex;align-items:center;gap:16px;padding:18px 5vw;border-bottom:1px solid #5a3827;flex-wrap:wrap}
header img{width:60px;height:60px;border-radius:14px}
header h1{font-size:32px;color:var(--or)}header p{color:var(--mu);font-size:14px}
.badge{border:1px solid var(--gold);color:var(--gold);padding:4px 14px;border-radius:99px;font-size:14px}
.bar{margin-inline-start:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ppl{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid #6b4430;border-radius:99px;padding:4px 10px}
.ppl button{width:32px;height:32px;border-radius:50%;border:0;background:var(--or);color:#fff;font-size:20px;cursor:pointer}
.ppl b{min-width:26px;text-align:center;font-size:18px}
main{padding:28px 5vw 60px;max-width:1200px;margin:auto}
h2{font-size:28px;margin-bottom:6px}.sub{color:var(--mu);margin-bottom:20px}
.tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.tab{background:var(--bg2);color:var(--cr);border:1px solid #6b4430;padding:10px 24px;border-radius:99px;font:inherit;cursor:pointer;font-size:17px}
.tab.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.dish{background:var(--card);border:1px solid #5f3a27;border-radius:18px;padding:22px;cursor:pointer;text-align:right;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.dish:hover,.dish:focus-visible{transform:translateY(-4px);border-color:var(--or);outline:none}
.dish .e{font-size:44px}.dish b{display:block;font-size:22px;margin:6px 0}.dish span{color:var(--mu);font-size:14px;display:block}
.dish em{font-style:normal;font-size:13px;color:var(--ok)}.dish em.no{color:var(--gold)}
.back{background:none;border:1px solid #6b4430;color:var(--cr);padding:8px 18px;border-radius:99px;cursor:pointer;font:inherit;margin-bottom:18px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero .e{font-size:60px}.hero h2{font-size:38px;color:var(--or)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.chips i{font-style:normal;background:var(--bg2);border:1px solid #5f3a27;padding:3px 14px;border-radius:99px;font-size:14px;color:var(--gold)}
.box{background:var(--card);border-radius:18px;padding:22px;border:1px solid #5f3a27}
.box h3{color:var(--gold);margin-bottom:10px}.box li{margin-inline-start:20px;margin-bottom:6px;font-size:18px}
.chk{display:flex;gap:12px;align-items:center;padding:8px 0;font-size:18px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:#E8691A}
.miss{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg2);border:1px dashed var(--gold)}
.miss.ok{border-color:var(--ok);color:var(--ok)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button.p{background:var(--or);color:#fff;border:0;padding:11px 22px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
button.s{background:var(--bg2);color:var(--cr);border:1px solid #6b4430;padding:11px 18px;border-radius:12px;font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold)}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;padding:16px;border-radius:14px;border:1px solid transparent;margin-bottom:8px}
.step.on{background:#5a3321;border-color:var(--or)}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:700;color:var(--gold)}
.step.on .n{background:var(--or);color:#fff}
.step .t{font-size:18px}.step small{display:block;color:var(--mu)}
.side{text-align:center;min-width:100px}
.time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.side button{margin-top:4px;padding:5px 12px;font-size:13px}
.note{color:var(--mu);font-size:13px;margin-top:20px}
</style></head><body>
